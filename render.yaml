services:
  - type: web
    name: catalogo-productos-api
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: catalogo-productos-db
          property: connectionString

databases:
  - name: catalogo-productos-db
    databaseName: catalogo_productos
    user: catalogo_api
