services:
  postgres:
    image: postgres:16-alpine
    container_name: catalogo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: catalogo_productos
      POSTGRES_USER: catalogo
      POSTGRES_PASSWORD: catalogo_local_2026
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalogo -d catalogo_productos"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: catalogo-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://catalogo:catalogo_local_2026@postgres:5432/catalogo_productos
      DB_SSL: "false"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
